<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exericio</title>
</head>
<body>
    <script>
        let nome = window.prompt("Digite seu nome:")
        let produto1 = Number.parseFloat(window.prompt("Informe o valor do produto 1"))
        let produto2 = Number.parseFloat(window.prompt("Informe o valor do produto 2"))
        let produto3 = Number.parseFloat(window.prompt("Informe o valor do produto 3"))
        let totalCompra = produto1 + produto2 + produto3
        window.alert(nome + ", o valor de sua compra é: " + totalCompra)
        
    </script>
</body>
</html>
