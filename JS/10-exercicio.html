<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>
</head>

<body>
    <script>
        let nome = window.prompt("Digite seu Nome:")
        let nota1 = Number(window.prompt("Informe a nota do 1° Bimestre:"))
        let nota2 = Number(window.prompt("Informe a nota do 2° Bimestre:"))
        let nota3 = Number(window.prompt("Informe a nota do 3° Bimestre:"))
        let nota4 = Number(window.prompt("Informe a nota do 4° Bimestre:"))
        let média = (nota1 + nota2 + nota3 + nota4) / 2

        window.alert(nome + " sua média é igual á " + média)

    </script>
</body>

</html>
