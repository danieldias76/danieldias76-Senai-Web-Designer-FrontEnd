<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>
</head>
<body>
    <script>
        let raio = Number(window.prompt("Informe o raio do círculo"))
        let area = 3.14 * raio**2
        let perimetro = (2 * 3.14) * raio
        window.alert("A área do círculo é " + area)
        window.alert("O perímetro do círculo é " + perimetro)
    </script>
</body>
</html>
