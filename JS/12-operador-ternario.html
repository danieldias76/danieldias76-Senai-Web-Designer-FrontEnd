<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Ternário</title>
</head>

<body>
    <script>
        let nomeAluno = window.prompt("Informe seu nome:")
        let idadeAluno = Number(window.prompt("Informe sua idade:"))
        let resultado = idadeAluno >= 18 ? "Permitido" : "Negado"
        window.alert(nomeAluno + " - " + resultado)
    </script>
</body>

</html>
