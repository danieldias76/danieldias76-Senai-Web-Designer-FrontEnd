<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>
</head>
<body>
    <script>
        let pontosA = Number(window.prompt("Infome a pontuação do time A:"))
        let pontosB = Number(window.prompt("Infome a pontuação do time B:"))
        let resultado = pontosA > pontosB ? "Time A venceu!" : pontosA < pontosB ? "Time B venceu!" : "Empate"
        window.alert(resultado)
    </script>
</body>
</html>
