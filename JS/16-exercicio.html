<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>
</head>

<body>
    <script>
        let nome = window.prompt("Digite seu nome")
        let produtoA = Number(window.prompt("Digite valor do produto A"))
        let produtoB = Number(window.prompt("Digite valor do produto B"))
        let produtoC = Number(window.prompt("Digite valor do produto C"))

        let teste = produtoA >= 300 && produtoB >= 500 && produtoC >= 1000 ? "Você ganhou o prêmio" : "Você não ganhou o prêmio"
        window.alert(teste + nome)
    </script>
</body>
