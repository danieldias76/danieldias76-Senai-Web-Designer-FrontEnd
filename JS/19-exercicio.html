<body>
    <script>
        let salario = Number(window.prompt("Informe seu sálario"))
        let a = Number(window.prompt("Informe o valor da venda A:"))
        let b = Number(window.prompt("Informe o valor da venda B:"))
        let c = Number(window.prompt("Informe o valor da venda C:"))
        let teste = a > 1500 || b > 2000 || c > 3000 ? 'Seu salario atual é R$: ' + 
        (salario + 350) + ', você recebeu um bônus de R$ 350 a mais' : ' Você não bateu a meta, seu salário continua o mesmo que é : R$' + salario 
        window.alert(teste)
    </script>
