<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getElementesByClassName</title>
</head>
<body>
    <p class="texto">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Incidunt, cumque.</p>
    <p class="texto">Doloribus temporibus optio vel in ducimus ipsum sequi perspiciatis omnis!</p>
    <p class="texto">Delectus quisquam recusandae quae voluptate vero ab eum fugiat iusto?</p>
    <script>
        let paragrafos = window.document.getElementsByClassName("texto")[1]
        paragrafos.style.color="purple"
        let paragrafos3 = window.document.getElementsByClassName("texto")[1]
        paragrafos3.style.backgroundColor="red"
    </script>
</body>
</html>
