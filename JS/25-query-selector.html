<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>query-Selector</title>
</head>

<body>
    <div id="teste1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quidem, dolor.</div>
    <p class="texto">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aut, eius?</p>

    <script>
        let div1 = window.document.querySelector("div#teste1")
        div1.style.color="gray"
        let class1 = window.document.querySelector("p.texto")
        class1.style.color="yellow"
    </script>
</body>

</html>
