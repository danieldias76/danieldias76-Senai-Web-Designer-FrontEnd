<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #divAmarela {
            background-color: yellow;
            width: 100px;
            height: 100px;
        }
    </style>
    <title>Conteudo Textual</title>
</head>

<body>
    <div id="divAmarela" onclick="mudar()">Teste</div>

    <script>
        function mudar() {
            let caixa = document.getElementById("divAmarela")
            caixa.innerText = "Clicou na caixa"
        }
    </script>
</body>

</html>
