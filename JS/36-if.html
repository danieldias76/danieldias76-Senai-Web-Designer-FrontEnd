<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF</title>
</head>
<body>

    <script>
        let idade = Number(window.prompt("Digite sua idade:"))

        if (idade >= 18){
            window.alert(`Sua idade é ${idade} você é adulto!`)
        }else{
            window.alert(`Sua idade é ${idade} você é menor de idade!`)
        }
    </script>
</body>
</html>
