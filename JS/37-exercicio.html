<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>
</head>

<body>
    <script>
        let nomeVendedor = window.prompt("Infome o seu nome:")
        let valorVenda = Number(window.prompt("Infome o valor da venda:"))
        if(valorVenda>=5000){
            window.alert(`${nomeVendedor}, você atingiu sua meta! Parabéns`)
        }
        else{
            window.alert(`${nomeVendedor}, você não superou a meta`)
        }
    </script>
</body>

</html>
