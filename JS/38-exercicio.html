<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exericio</title>
</head>

<body>
    <script>
        let diaAtual = window.prompt("Qual o dia de hoje?")
        if (diaAtual == "Sábado" || diaAtual == "sábado" || diaAtual == "Domingo" || diaAtual == "domingo") {
            window.alert(`Hoje é ${diaAtual}, dia de folga`)
        }
        else {
            window.alert(`Hoje é ${diaAtual}, dia de trabalho`)
        }
    </script>
</body>

</html>
