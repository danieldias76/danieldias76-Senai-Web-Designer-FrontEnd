<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
</head>

<body>
    <script>
        let perfil = window.prompt("Informe o perfil de Usuário")
        switch (perfil) {
            case "adm":
                window.alert("Usuário logado como administrador")
                break

            case "user":
                window.alert("Usuário logado como usuário padrão")
                break

            default:
                window.alert("Usuário não reconhecido")
                break
        }
    </script>
</body>

</html>
